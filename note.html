<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>便签</title>
    <script>
      // Set background from URL color param to avoid white flash on window spawn
      try {
        var params = new URLSearchParams(location.hash.slice(1));
        var color = params.get('color');
        if (color) {
          document.documentElement.style.backgroundColor = '#' + color;
        }
      } catch (_) {}
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Keep body transparent so Tauri window transparency works.
      // The React component handles background color with opacity.
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
