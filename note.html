<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>便签</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Set background color immediately from URL hash to avoid white flash
      var hash = location.hash;
      var m = hash.match(/color=([A-Fa-f0-9]{6})/);
      if (m) document.body.style.background = '#' + m[1];
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
