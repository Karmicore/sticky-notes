<script>
// ── Canvas displacement map generator (shuding/liquid-glass approach) ──
function createLensDisplacementMap(w, h, intensity) {
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  const cx = w / 2, cy = h / 2;
  const r = Math.min(w, h) / 2;

  // Radial gradient simulating lens curvature
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grad.addColorStop(0, `rgba(128, 128, 0, ${intensity})`);
  grad.addColorStop(0.7, `rgba(128, 128, 0, ${intensity * 0.6})`);
  grad.addColorStop(1, "rgba(128, 128, 0, 0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Add some noise for organic feel
  const imgData = ctx.getImageData(0, 0, w, h);
  for (let i = 0; i < imgData.data.length; i += 4) {
    imgData.data[i] += (Math.random() - 0.5) * 10 * intensity;     // R → X displacement
    imgData.data[i + 1] += (Math.random() - 0.5) * 10 * intensity; // G → Y displacement
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas.toDataURL();
}

// ── Physics-based refraction profile (archisvaze/liquid-glass approach) ──
function createRefractionDisplacementMap(w, h, thickness, ior, intensity) {
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  const cx = w / 2, cy = h / 2;
  const r = Math.min(w, h) / 2;
  const eta = 1 / ior;

  const imgData = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const dx = (x - cx) / r;
      const dy = (y - cy) / r;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const idx = (y * w + x) * 4;

      if (dist < 1) {
        // Surface normal (simplified sphere)
        const nz = Math.sqrt(Math.max(0, 1 - dist * dist));
        const nx = -dx * 0.5;
        const ny = -dy * 0.5;

        // Snell's law refraction
        const dot = nz;
        const k = 1 - eta * eta * (1 - dot * dot);
        if (k > 0) {
          const refrX = -(eta * dot + Math.sqrt(k)) * nx;
          const refrY = -(eta * dot + Math.sqrt(k)) * ny;
          imgData.data[idx] = 128 + refrX * thickness * intensity;
          imgData.data[idx + 1] = 128 + refrY * thickness * intensity;
          imgData.data[idx + 2] = 128;
          imgData.data[idx + 3] = 255;
        } else {
          // Total internal reflection
          imgData.data[idx] = 128;
          imgData.data[idx + 1] = 128;
          imgData.data[idx + 2] = 128;
          imgData.data[idx + 3] = 255;
        }
      } else {
        // Outside glass — no displacement
        imgData.data[idx] = 128;
        imgData.data[idx + 1] = 128;
        imgData.data[idx + 2] = 128;
        imgData.data[idx + 3] = 0;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas.toDataURL();
}

// Create dynamic SVG filters for canvas-based effects
function ensureDynamicFilter(id, dataUrl, scale) {
  let existing = document.getElementById(id);
  if (existing) existing.remove();

  const svgNS = "http://www.w3.org/2000/svg";
  const filter = document.createElementNS(svgNS, "filter");
  filter.setAttribute("id", id);
  filter.setAttribute("x", "-20%");
  filter.setAttribute("y", "-20%");
  filter.setAttribute("width", "140%");
  filter.setAttribute("height", "140%");

  const feImg = document.createElementNS(svgNS, "feImage");
  feImg.setAttribute("href", dataUrl);
  feImg.setAttribute("result", "map");
  feImg.setAttribute("preserveAspectRatio", "none");

  const feDisp = document.createElementNS(svgNS, "feDisplacementMap");
  feDisp.setAttribute("in", "SourceGraphic");
  feDisp.setAttribute("in2", "map");
  feDisp.setAttribute("scale", scale);
  feDisp.setAttribute("xChannelSelector", "R");
  feDisp.setAttribute("yChannelSelector", "G");

  filter.appendChild(feImg);
  filter.appendChild(feDisp);
  document.getElementById("svg-filters").appendChild(filter);
}

// Generate per-intensity SVG filters for canvas-based effects (10 levels)
(function() {
  for (let level = 1; level <= 10; level++) {
    const v = level / 10;
    const lensMap = createLensDisplacementMap(200, 100, v);
    const refrMap = createRefractionDisplacementMap(200, 100, 80, 1.5, v);
    ensureDynamicFilter(`lens-filter-${level}`, lensMap, 20 + v * 50);
    ensureDynamicFilter(`refr-filter-${level}`, refrMap, 20 + v * 50);
  }
})();

let selectedIdx = null;
const grid = document.getElementById("grid");

effects.forEach((ef, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <span class="num">${i + 1}</span>
    <div class="name">${ef.name}</div>
    <div class="desc">${ef.desc}</div>
    <div class="preview">
      <div class="preview-bg"></div>
      <div class="preview-glass" id="glass-${i}"></div>
      <div class="preview-text">便签内容预览</div>
    </div>
    <div class="slider-row">
      <label>液态</label>
      <input type="range" min="0" max="100" value="50" id="slider-${i}">
      <span class="slider-val" id="val-${i}">50%</span>
    </div>
  `;

  card.querySelector(`#slider-${i}`).addEventListener("input", (e) => {
    const v = e.target.value / 100;
    document.getElementById(`val-${i}`).textContent = e.target.value + "%";
    const glass = document.getElementById(`glass-${i}`);
    const style = ef.css(v);
    Object.assign(glass.style, style);
  });

  card.addEventListener("click", (e) => {
    if (e.target.type === "range") return;
    selectedIdx = i;
    document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
    document.getElementById("selectedName").textContent = `#${i+1} ${ef.name}`;
    const v = document.getElementById(`slider-${i}`).value / 100;
    const style = ef.css(v);
    const codeLines = Object.entries(style).map(([k, val]) => {
      const cssKey = k.replace(/([A-Z])/g, "-$1").toLowerCase();
      return `  ${cssKey}: ${val};`;
    });
    document.getElementById("selectedCode").textContent = `/* #${i+1} ${ef.name} — 液态 ${Math.round(v*100)}% */\n${codeLines.join("\n")}`;
  });

  // Init preview at 50%
  const initGlass = card.querySelector(`#glass-${i}`);
  Object.assign(initGlass.style, ef.css(0.5));

  grid.appendChild(card);
});
</script>
</body>
</html>
