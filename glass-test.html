<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>液态玻璃效果测试 — 像素级折射</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1117; color: #e6edf3; font-family: system-ui; padding: 20px 20px 80px; }
h1 { text-align: center; font-size: 24px; margin-bottom: 4px; }
.subtitle { text-align: center; color: #8b949e; font-size: 13px; margin-bottom: 28px; }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; max-width: 1000px; margin: 0 auto; }
.card {
  background: #161b22; border-radius: 16px; padding: 20px; border: 2px solid #21262d;
  transition: border-color 0.15s; cursor: pointer; position: relative;
}
.card:hover { border-color: #58a6ff; }
.card.selected { border-color: #58a6ff; box-shadow: 0 0 20px rgba(88,166,255,0.15); }
.num { position: absolute; top: 8px; left: 10px; font-size: 10px; color: #484f58; }
.name { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.desc { font-size: 11px; color: #8b949e; margin-bottom: 12px; line-height: 1.4; }
.mode-tag { display: inline-block; font-size: 9px; padding: 2px 7px; border-radius: 4px; background: #58a6ff22; color: #58a6ff; margin-bottom: 8px; }

.preview {
  width: 100%; height: 180px; border-radius: 12px; position: relative;
  overflow: hidden; margin-bottom: 14px; cursor: crosshair;
}

.glass-element {
  position: absolute; border-radius: 999px; overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  box-shadow: 0 12px 40px rgba(0,0,0,0.25);
}
.glass-canvas {
  position: absolute; inset: 0; border-radius: inherit;
}
.glass-content {
  position: relative; z-index: 1;
  color: white; font-size: 13px; font-weight: 500;
  text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  height: 100%; padding: 0 20px; white-space: nowrap;
}
.glass-border-1, .glass-border-2 {
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  padding: 1.5px;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.glass-border-1 {
  mix-blend-mode: screen; opacity: 0.25;
  box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.5), inset 0 1px 3px rgba(255,255,255,0.25), inset 0 1px 4px rgba(0,0,0,0.35);
}
.glass-border-2 {
  mix-blend-mode: overlay;
  box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.5), inset 0 1px 3px rgba(255,255,255,0.25), inset 0 1px 4px rgba(0,0,0,0.35);
}

.mouse-dot {
  position: absolute; width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,0.9); pointer-events: none;
  transform: translate(-50%, -50%); display: none; z-index: 20;
  box-shadow: 0 0 10px rgba(255,255,255,0.5);
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0d1117; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #484f58; }

.slider-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.slider-row label { font-size: 11px; color: #8b949e; white-space: nowrap; min-width: 60px; }
.slider-row input[type=range] { flex: 1; height: 6px; -webkit-appearance: none; appearance: none; background: linear-gradient(90deg, #1f6feb55, #58a6ff); border-radius: 3px; outline: none; cursor: pointer; }
.slider-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #58a6ff; cursor: pointer; box-shadow: 0 0 8px rgba(88,166,255,0.5); }
.slider-row input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #58a6ff; cursor: pointer; border: none; box-shadow: 0 0 8px rgba(88,166,255,0.5); }
.slider-val { font-size: 11px; color: #58a6ff; min-width: 36px; text-align: right; }

.info-box {
  max-width: 1000px; margin: 28px auto 0; background: #161b22; border-radius: 14px;
  padding: 20px; border: 1px solid #21262d;
}
.info-box h3 { font-size: 15px; margin-bottom: 8px; }
.info-box .sel { color: #58a6ff; font-size: 14px; margin-bottom: 10px; }
.info-box pre { background: #0d1117; border-radius: 8px; padding: 14px; font-size: 11px; color: #8b949e; overflow-x: auto; line-height: 1.6; font-family: 'Cascadia Code','Fira Code',monospace; }
.k { color: #79c0ff; } .v { color: #a5d6ff; } .c { color: #484f58; }
</style>
</head>
<body>

<h1>液态玻璃效果测试</h1>
<p class="subtitle">Canvas 像素级折射 — 拖动滑块看折射率变化 — 在预览区移动鼠标</p>

<div class="grid" id="grid"></div>

<div class="info-box">
  <h3>已选效果</h3>
  <div class="sel" id="selName">未选择</div>
  <pre id="selCode">// 点击卡片选择效果</pre>
</div>

<script>
// ══════════════════════════════════════════════════════
// Canvas 像素级折射引擎
// ══════════════════════════════════════════════════════

// 绘制复杂背景到 canvas（模拟人脸/密集图案）
function drawBackground(ctx, w, h) {
  // 深色底
  ctx.fillStyle = "#1a1a2e";
  ctx.fillRect(0, 0, w, h);

  // 网格
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 30) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y < h; y += 30) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  // 密集代码文字
  const code = [
    "const glass = new LiquidGlass({ displacement: 70, blur: 16 })",
    "fragment: (uv, mouse) => { const d = roundedRectSDF(uv); }",
    "feDisplacementMap feImage feColorMatrix feComponentTransfer",
    "chromatic aberration R/G/B channels displaced separately",
    "便签内容测试液态玻璃折射扭曲色差弹性跟随边缘高光",
    "UV坐标 SDF函数 smoothStep roundedRectSDF circleSDF",
    "backdrop-filter blur saturate brightness contrast",
    "displacementScale aberrationIntensity radialGradient",
    "ABCDEFGHIJKLMNOPQRSTabcdefghijklmnopqrst01234567890",
    "requestAnimationFrame canvas displacement map pixel",
    "elasticity hover click highlights underlying light",
    "standard polar prominent shader modes SVG filter canvas",
  ];
  ctx.font = "8px monospace";
  ctx.fillStyle = "rgba(180,200,255,0.2)";
  for (let y = 0; y < h; y += 14) {
    const line = code[(y / 14) % code.length | 0];
    ctx.fillText(line, 4, y + 10);
  }

  // 肤色调椭圆（模拟人脸）
  const grd1 = ctx.createRadialGradient(w*0.5, h*0.35, 0, w*0.5, h*0.35, w*0.45);
  grd1.addColorStop(0, "#e8b89a");
  grd1.addColorStop(0.4, "#d4956b");
  grd1.addColorStop(0.7, "#c47a52");
  grd1.addColorStop(1, "transparent");
  ctx.fillStyle = grd1;
  ctx.fillRect(0, 0, w, h);

  // 眼睛
  ctx.fillStyle = "#3a2a1a";
  ctx.beginPath(); ctx.ellipse(w*0.38, h*0.30, w*0.04, h*0.06, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(w*0.62, h*0.30, w*0.04, h*0.06, 0, 0, Math.PI*2); ctx.fill();

  // 鼻子
  ctx.fillStyle = "rgba(180,120,80,0.3)";
  ctx.beginPath(); ctx.ellipse(w*0.5, h*0.45, w*0.03, h*0.06, 0, 0, Math.PI*2); ctx.fill();

  // 嘴
  ctx.fillStyle = "#c47a52";
  ctx.beginPath(); ctx.ellipse(w*0.5, h*0.55, w*0.06, h*0.03, 0, 0, Math.PI*2); ctx.fill();

  // 彩色圆形装饰
  const colors = ["#ff6b6b","#ffd93d","#6bcb77","#4d96ff","#ff6b9d","#c084fc","#22d3ee"];
  for (let i = 0; i < 12; i++) {
    const cx = Math.random() * w, cy = Math.random() * h, r = 8 + Math.random() * 20;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fillStyle = colors[i % colors.length] + "40";
    ctx.fill();
  }
}

// SDF 函数
function roundedRectSDF(x, y, rx, ry, radius) {
  const dx = Math.max(Math.abs(x) - rx + radius, 0);
  const dy = Math.max(Math.abs(y) - ry + radius, 0);
  return Math.sqrt(dx*dx + dy*dy) - radius;
}

function circleSDF(x, y, r) {
  return Math.sqrt(x*x + y*y) - r;
}

function smoothStep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

// 渲染折射 canvas
function renderRefraction(canvas, bgData, params) {
  const { width, height } = canvas;
  const ctx = canvas.getContext("2d");
  const out = ctx.createImageData(width, height);
  const dst = out.data;
  const src = bgData.data;

  const {
    refractionIndex = 1.5,  // 折射率 — 核心参数
    chromaticAberration = 0, // 色差
    shape = "pill",          // pill | rect | circle
    cornerRadius = 0.5,
    mouseX = 0.5, mouseY = 0.5,
    elasticity = 0,
  } = params;

  // 玻璃区域（归一化坐标）
  const gx = 0.5, gy = 0.5, gw = 0.325, gh = 0.23;

  for (let py = 0; py < height; py++) {
    for (let px = 0; px < width; px++) {
      const i = (py * width + px) * 4;
      const nx = px / width;
      const ny = py / height;

      // 判断是否在玻璃区域内
      const dx = (nx - gx) / gw;
      const dy = (ny - gy) / gh;
      let dist;
      if (shape === "circle") {
        dist = Math.sqrt(dx*dx + dy*dy);
      } else {
        const r = cornerRadius;
        dist = roundedRectSDF(dx, dy, 1, 1, r * 0.5);
      }

      // 平滑边缘
      const edge = smoothStep(0.15, -0.05, dist);

      if (edge > 0.01) {
        // 折射位移 — 基于折射率
        const refractStrength = (refractionIndex - 1.0) * 0.15; // 1.0=无折射, 1.5=中等, 2.0=强
        const edgeFade = edge * edge; // 边缘折射更强

        // 基于距离中心的方向计算折射
        const cx = nx - gx, cy = ny - gy;
        const cDist = Math.sqrt(cx*cx + cy*cy);
        const nx2 = cDist > 0 ? cx / cDist : 0;
        const ny2 = cDist > 0 ? cy / cDist : 0;

        // 边缘弯曲 — 距离中心越远折射越大
        const bendX = nx2 * refractStrength * edgeFade * 0.3;
        const bendY = ny2 * refractStrength * edgeFade * 0.3;

        // 色差 — R/G/B 通道分别偏移不同量
        const rShift = chromaticAberration * 0.003;
        const bShift = -chromaticAberration * 0.003;

        // 采样 R 通道
        const srX = Math.round((nx + bendX + rShift * nx2) * width);
        const srY = Math.round((ny + bendY + rShift * ny2) * height);
        const srI = (Math.max(0, Math.min(height-1, srY)) * width + Math.max(0, Math.min(width-1, srX))) * 4;

        // 采样 G 通道
        const sgX = Math.round((nx + bendX) * width);
        const sgY = Math.round((ny + bendY) * height);
        const sgI = (Math.max(0, Math.min(height-1, sgY)) * width + Math.max(0, Math.min(width-1, sgX))) * 4;

        // 采样 B 通道
        const sbX = Math.round((nx + bendX + bShift * nx2) * width);
        const sbY = Math.round((ny + bendY + bShift * ny2) * height);
        const sbI = (Math.max(0, Math.min(height-1, sbY)) * width + Math.max(0, Math.min(width-1, sbX))) * 4;

        // 合成 — 加一点玻璃白度
        const glassWhite = 0.12 * edge;
        dst[i]     = Math.min(255, src[srI]     * (1-glassWhite*0.5) + 255 * glassWhite * 0.7);
        dst[i + 1] = Math.min(255, src[sgI + 1] * (1-glassWhite*0.5) + 255 * glassWhite * 0.8);
        dst[i + 2] = Math.min(255, src[sbI + 2] * (1-glassWhite*0.5) + 255 * glassWhite * 0.9);
        dst[i + 3] = Math.round(255 * edge);
      } else {
        // 玻璃外 — 透明，显示底层背景
        dst[i] = src[i];
        dst[i + 1] = src[i + 1];
        dst[i + 2] = src[i + 2];
        dst[i + 3] = 0;
      }
    }
  }
  ctx.putImageData(out, 0, 0);
}

// ══════════════════════════════════════════════════════
// 10 种效果
// ══════════════════════════════════════════════════════

const effects = [
  {
    name: "Standard 标准",
    desc: "折射率 1.44 — 普通玻璃",
    refractionIndex: 1.44, chromaticAberration: 2,
    shape: "pill", cornerRadius: 0.5, elasticity: 0.15,
  },
  {
    name: "水 晶",
    desc: "折射率 1.55 — 水晶材质",
    refractionIndex: 1.55, chromaticAberration: 3,
    shape: "pill", cornerRadius: 0.5, elasticity: 0.2,
  },
  {
    name: "钻 石",
    desc: "折射率 2.42 — 钻石级折射",
    refractionIndex: 2.42, chromaticAberration: 5,
    shape: "pill", cornerRadius: 0.5, elasticity: 0.1,
  },
  {
    name: "强色差",
    desc: "折射率 1.5 + 色差 8 — 彩虹边缘",
    refractionIndex: 1.5, chromaticAberration: 8,
    shape: "pill", cornerRadius: 0.5, elasticity: 0.15,
  },
  {
    name: "厚透镜",
    desc: "折射率 1.8 — 厚玻璃强弯曲",
    refractionIndex: 1.8, chromaticAberration: 2,
    shape: "pill", cornerRadius: 0.5, elasticity: 0.1,
  },
  {
    name: "毛玻璃",
    desc: "折射率 1.3 + 轻微模糊感",
    refractionIndex: 1.3, chromaticAberration: 1,
    shape: "pill", cornerRadius: 0.5, elasticity: 0.05,
  },
  {
    name: "弹性液态",
    desc: "弹性 0.4 — 向鼠标方向拉伸",
    refractionIndex: 1.5, chromaticAberration: 2,
    shape: "pill", cornerRadius: 0.5, elasticity: 0.4,
  },
  {
    name: "方形玻璃",
    desc: "方形卡片 — 折射率 1.5",
    refractionIndex: 1.5, chromaticAberration: 2,
    shape: "rect", cornerRadius: 0.15, elasticity: 0.15,
  },
  {
    name: "极致液态",
    desc: "折射率 2.0 + 色差 6 — 最强视觉冲击",
    refractionIndex: 2.0, chromaticAberration: 6,
    shape: "pill", cornerRadius: 0.5, elasticity: 0.35,
  },
  {
    name: "极简玻璃",
    desc: "折射率 1.2 — 轻微折射，适合 UI",
    refractionIndex: 1.2, chromaticAberration: 0.5,
    shape: "pill", cornerRadius: 0.5, elasticity: 0.1,
  },
];

// ══════════════════════════════════════════════════════
// 渲染
// ══════════════════════════════════════════════════════

const grid = document.getElementById("grid");
let selectedIdx = null;
const bgCache = {};

function getBgCanvas(w, h) {
  const key = w + "x" + h;
  if (!bgCache[key]) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    drawBackground(c.getContext("2d"), w, h);
    bgCache[key] = c;
  }
  return bgCache[key];
}

function updateGlass(idx, mouseX, mouseY) {
  const ef = effects[idx];
  const glass = document.getElementById("glass-" + idx);
  const canvas = document.getElementById("canvas-" + idx);
  if (!glass || !canvas) return;

  const w = canvas.width, h = canvas.height;
  const bg = getBgCanvas(w, h);
  const bgData = bg.getContext("2d").getImageData(0, 0, w, h);

  // 归一化鼠标位置（相对于 preview 区域）
  const preview = glass.parentElement;
  const rect = preview.getBoundingClientRect();
  const mx = (mouseX - rect.left) / rect.width;
  const my = (mouseY - rect.top) / rect.height;

  renderRefraction(canvas, bgData, {
    refractionIndex: ef.refractionIndex,
    chromaticAberration: ef.chromaticAberration,
    shape: ef.shape,
    cornerRadius: ef.cornerRadius,
    mouseX: mx, mouseY: my,
    elasticity: ef.elasticity,
  });

  // 弹性跟随
  const cx = rect.left + rect.width * 0.5;
  const cy = rect.top + rect.height * 0.5;
  const dx = mouseX - cx;
  const dy = mouseY - cy;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const edgeDistX = Math.max(0, Math.abs(dx) - rect.width * 0.3);
  const edgeDistY = Math.max(0, Math.abs(dy) - rect.height * 0.2);
  const edgeDist = Math.sqrt(edgeDistX * edgeDistX + edgeDistY * edgeDistY);
  const activationZone = 200;
  const fadeIn = edgeDist > activationZone ? 0 : 1 - edgeDist / activationZone;

  const nx = dist > 0 ? dx / dist : 0;
  const ny = dist > 0 ? dy / dist : 0;
  const stretch = Math.min(dist / 300, 1) * ef.elasticity * fadeIn;
  const scaleX = 1 + Math.abs(nx) * stretch * 0.3 - Math.abs(ny) * stretch * 0.15;
  const scaleY = 1 + Math.abs(ny) * stretch * 0.3 - Math.abs(nx) * stretch * 0.15;
  const tx = dx * ef.elasticity * 0.1 * fadeIn;
  const ty = dy * ef.elasticity * 0.1 * fadeIn;

  glass.style.transform = `translate(${tx}px, ${ty}px) scaleX(${Math.max(0.8, scaleX).toFixed(4)}) scaleY(${Math.max(0.8, scaleY).toFixed(4)})`;

  // 边缘高光
  const angle = 135 + (mouseX - rect.left) / rect.width * 30;
  const b1 = glass.querySelector(".glass-border-1");
  const b2 = glass.querySelector(".glass-border-2");
  if (b1) b1.style.background = `linear-gradient(${angle}deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.12) 33%, rgba(255,255,255,0.4) 66%, rgba(255,255,255,0) 100%)`;
  if (b2) b2.style.background = `linear-gradient(${angle}deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.32) 33%, rgba(255,255,255,0.6) 66%, rgba(255,255,255,0) 100%)`;
}

effects.forEach((ef, i) => {
  const card = document.createElement("div");
  card.className = "card";
  const initSliderVal = Math.round((ef.refractionIndex - 1.0) / 1.5 * 100);
  card.innerHTML = `
    <span class="num">${i + 1}</span>
    <div class="name">${ef.name}</div>
    <span class="mode-tag">n=${ef.refractionIndex}</span>
    <div class="desc">${ef.desc}</div>
    <div class="preview" id="preview-${i}">
      <canvas class="glass-canvas" id="canvas-${i}" width="300" height="140"></canvas>
      <div class="glass-element" id="glass-${i}" style="
        width: 65%; height: 42px; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
      ">
        <canvas class="glass-canvas" id="glassCanvas-${i}" width="200" height="42"></canvas>
        <div class="glass-content">Liquid Glass</div>
        <div class="glass-border-1"></div>
        <div class="glass-border-2"></div>
      </div>
      <div class="mouse-dot" id="dot-${i}"></div>
    </div>
    <div class="slider-row">
      <label>折射率</label>
      <input type="range" min="0" max="100" value="${initSliderVal}" id="slider-${i}">
      <span class="slider-val" id="val-${i}">${ef.refractionIndex.toFixed(2)}</span>
    </div>
  `;

  const slider = card.querySelector(`#slider-${i}`);
  const dot = card.querySelector(`#dot-${i}`);
  const preview = card.querySelector(`#preview-${i}`);

  // Slider — 控制折射率
  slider.addEventListener("input", (e) => {
    const pct = e.target.value / 100;
    effects[i].refractionIndex = 1.0 + pct * 1.5; // 1.0 ~ 2.5
    document.getElementById("val-" + i).textContent = effects[i].refractionIndex.toFixed(2);
    // 重绘背景层
    const bgCanvas = document.getElementById("canvas-" + i);
    const bgCtx = bgCanvas.getContext("2d");
    drawBackground(bgCtx, bgCanvas.width, bgCanvas.height);
    delete bgCache[bgCanvas.width + "x" + bgCanvas.height];
    // 重绘折射
    const rect2 = preview.getBoundingClientRect();
    updateGlass(i, rect2.left + rect2.width / 2, rect2.top + rect2.height / 2);
  });

  // Mouse
  preview.addEventListener("mousemove", (e) => {
    dot.style.display = "block";
    dot.style.left = e.offsetX + "px";
    dot.style.top = e.offsetY + "px";
    updateGlass(i, e.clientX, e.clientY);
  });
  preview.addEventListener("mouseleave", () => {
    dot.style.display = "none";
    const rect2 = preview.getBoundingClientRect();
    updateGlass(i, rect2.left + rect2.width / 2, rect2.top + rect2.height / 2);
  });

  // Select
  card.addEventListener("click", (e) => {
    if (e.target.type === "range") return;
    selectedIdx = i;
    document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
    document.getElementById("selName").textContent = `#${i + 1} ${ef.name}`;
    document.getElementById("selCode").innerHTML =
      `<span class="c">// #${i + 1} ${ef.name}</span>\n` +
      `<span class="k">refractionIndex</span>: <span class="v">${ef.refractionIndex}</span>  <span class="c">// 折射率 (1.0=无, 1.5=玻璃, 2.4=钻石)</span>\n` +
      `<span class="k">chromaticAberration</span>: <span class="v">${ef.chromaticAberration}</span>  <span class="c">// 色差 (0=无, 5=强)</span>\n` +
      `<span class="k">shape</span>: <span class="v">"${ef.shape}"</span>\n` +
      `<span class="k">elasticity</span>: <span class="v">${ef.elasticity}</span>  <span class="c">// 弹性跟随</span>`;
  });

  // Init — 绘制背景 + 初始折射
  setTimeout(() => {
    const rect2 = preview.getBoundingClientRect();
    updateGlass(i, rect2.left + rect2.width / 2, rect2.top + rect2.height / 2);
  }, 50 + i * 30);

  grid.appendChild(card);
});
</script>
</body>
</html>
