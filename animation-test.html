<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>完成动画测试 - 20种效果</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: system-ui; padding: 20px; }
h1 { text-align: center; margin-bottom: 8px; font-size: 20px; }
.subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 900px; margin: 0 auto; }
.card {
  background: #16213e; border-radius: 10px; padding: 16px; text-align: center;
  cursor: pointer; transition: all 0.15s; border: 2px solid transparent; position: relative;
}
.card:hover { border-color: #4fc3f7; transform: translateY(-2px); }
.card:active { transform: scale(0.97); }
.num { font-size: 11px; color: #666; position: absolute; top: 6px; left: 8px; }
.icon { font-size: 28px; margin-bottom: 6px; }
.name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.desc { font-size: 10px; color: #888; line-height: 1.3; }
.pick { margin-top: 20px; text-align: center; }
.pick button {
  background: #4fc3f7; color: #000; border: none; padding: 10px 24px;
  border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600;
}
.pick button:hover { background: #81d4fa; }
.check-area {
  max-width: 900px; margin: 30px auto 0; text-align: center;
  background: #16213e; border-radius: 10px; padding: 20px;
}
.check-area h3 { margin-bottom: 12px; font-size: 15px; }
.sim { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; cursor: pointer; user-select: none; }
.sim .box { width: 22px; height: 22px; border: 2px solid #555; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
</style>
</head>
<body>

<h1>完成动画测试</h1>
<p class="subtitle">点击卡片预览效果，选一个最喜欢的</p>

<div class="grid" id="grid"></div>

<div class="check-area">
  <h3>模拟 checkbox 完成</h3>
  <div class="sim" id="simCheck" onclick="toggleSim()">
    <div class="box" id="simBox">⬜</div>
    <span>点击勾选，体验完整流程</span>
  </div>
</div>

<div class="pick" id="pickBar" style="display:none">
  <button onclick="showCode()">显示代码</button>
</div>

<pre id="codeOutput" style="max-width:900px;margin:16px auto;background:#0d1117;color:#7ee787;padding:16px;border-radius:8px;display:none;font-size:13px;line-height:1.5"></pre>

<script>
let selectedIdx = null;

const effects = [
  {
    name: "上升光点",
    icon: "✨",
    desc: "小光点从底部缓缓上升",
    run() {
      confetti({ particleCount: 30, spread: 40, startVelocity: 25, gravity: -0.6, ticks: 250, origin: { y: 0.85 }, shapes: ["circle"], scalar: 0.6, colors: ["#ffd700","#fff176","#fff9c4"] });
    }
  },
  {
    name: "阶梯上升",
    icon: "📶",
    desc: "三波粒子依次上升，阶梯感",
    run() {
      const base = { spread: 35, startVelocity: 20, gravity: -0.8, ticks: 220, origin: { y: 0.9 }, shapes: ["circle"], scalar: 0.5 };
      confetti({ ...base, particleCount: 10, colors: ["#81d4fa"] });
      setTimeout(() => confetti({ ...base, particleCount: 15, colors: ["#4fc3f7"], origin: { y: 0.8 } }), 200);
      setTimeout(() => confetti({ ...base, particleCount: 25, colors: ["#0288d1","#29b6f6"], origin: { y: 0.7 } }), 400);
    }
  },
  {
    name: "星轨上升",
    icon: "⭐",
    desc: "星星沿轨迹缓缓升起",
    run() {
      confetti({ particleCount: 20, spread: 30, startVelocity: 15, gravity: -0.4, ticks: 300, origin: { y: 0.9 }, shapes: ["star"], scalar: 0.7, colors: ["#ffd54f","#ffab00","#ffe082"] });
    }
  },
  {
    name: "喷泉涌出",
    icon: "⛲",
    desc: "从底部中央喷涌而上",
    run() {
      confetti({ particleCount: 60, spread: 25, startVelocity: 45, gravity: 0.8, ticks: 200, origin: { x: 0.5, y: 0.95 }, shapes: ["circle","star"], colors: ["#4fc3f7","#81d4fa","#b3e5fc","#e1f5fe"] });
    }
  },
  {
    name: "左升右升",
    icon: "🌅",
    desc: "左右两侧同时升起",
    run() {
      const base = { startVelocity: 20, gravity: -0.5, ticks: 220, shapes: ["circle"], scalar: 0.5 };
      confetti({ ...base, particleCount: 20, spread: 30, origin: { x: 0.2, y: 0.85 }, colors: ["#ff8a65"] });
      confetti({ ...base, particleCount: 20, spread: 30, origin: { x: 0.8, y: 0.85 }, colors: ["#4fc3f7"] });
    }
  },
  {
    name: "光柱上升",
    icon: "🔦",
    desc: "窄束粒子直线上升",
    run() {
      confetti({ particleCount: 25, spread: 8, startVelocity: 35, gravity: -0.7, ticks: 250, origin: { x: 0.5, y: 0.95 }, shapes: ["circle"], scalar: 0.4, colors: ["#fff","#e3f2fd","#bbdefb"] });
    }
  },
  {
    name: "螺旋上升",
    icon: "🌀",
    desc: "粒子旋转着上升",
    run() {
      let angle = 0;
      const interval = setInterval(() => {
        const x = 0.5 + Math.cos(angle) * 0.15;
        const y = 0.85 + Math.sin(angle) * 0.05;
        confetti({ particleCount: 3, spread: 10, startVelocity: 20, gravity: -0.6, ticks: 200, origin: { x, y }, shapes: ["circle"], scalar: 0.5, colors: ["#ce93d8","#ba68c8","#ab47bc"] });
        angle += 0.8;
        if (angle > Math.PI * 4) clearInterval(interval);
      }, 80);
    }
  },
  {
    name: "渐进满屏",
    icon: "📈",
    desc: "粒子逐渐增多，越来越满",
    run() {
      const delays = [0, 200, 400, 600, 800];
      const counts = [5, 10, 18, 28, 40];
      delays.forEach((d, i) => {
        setTimeout(() => confetti({
          particleCount: counts[i], spread: 30 + i * 10, startVelocity: 20,
          gravity: -0.5, ticks: 200, origin: { y: 0.85 - i * 0.03 },
          shapes: ["circle","star"], scalar: 0.6,
          colors: ["#a5d6a7","#66bb6a","#43a047","#2e7d32"]
        }), d);
      });
    }
  },
  {
    name: "星光绽放",
    icon: "💫",
    desc: "中心点向外绽放后上升",
    run() {
      confetti({ particleCount: 40, spread: 360, startVelocity: 15, gravity: -0.3, ticks: 280, origin: { x: 0.5, y: 0.7 }, shapes: ["star"], scalar: 0.8, colors: ["#ffd700","#ffb300","#ff8f00"] });
    }
  },
  {
    name: "飘雪反转",
    icon: "❄️",
    desc: "像雪花但是往上飘",
    run() {
      for (let i = 0; i < 5; i++) {
        setTimeout(() => confetti({
          particleCount: 8, spread: 80, startVelocity: 10, gravity: -0.2,
          ticks: 350, origin: { y: 0.95 }, shapes: ["circle"], scalar: 1.2,
          colors: ["#e3f2fd","#bbdefb","#90caf9"], drift: (Math.random() - 0.5) * 0.5
        }), i * 150);
      }
    }
  },
  {
    name: "数字升级",
    icon: "🔼",
    desc: "三波从小到大，像升级",
    run() {
      confetti({ particleCount: 5, spread: 15, startVelocity: 20, gravity: -0.6, ticks: 200, origin: { y: 0.85 }, shapes: ["circle"], scalar: 0.3, colors: ["#a5d6a7"] });
      setTimeout(() => confetti({ particleCount: 12, spread: 25, startVelocity: 25, gravity: -0.6, ticks: 200, origin: { y: 0.8 }, shapes: ["circle","star"], scalar: 0.5, colors: ["#66bb6a"] }), 250);
      setTimeout(() => confetti({ particleCount: 25, spread: 40, startVelocity: 30, gravity: -0.6, ticks: 250, origin: { y: 0.75 }, shapes: ["star"], scalar: 0.7, colors: ["#43a047","#2e7d32","#ffd54f"] }), 500);
    }
  },
  {
    name: "环形扩散",
    icon: "⭕",
    desc: "从中心向外扩散圆环",
    run() {
      for (let i = 0; i < 3; i++) {
        setTimeout(() => confetti({
          particleCount: 16, spread: 360, startVelocity: 8 + i * 5,
          gravity: -0.3, ticks: 250, origin: { x: 0.5, y: 0.7 },
          shapes: ["circle"], scalar: 0.4 + i * 0.15,
          colors: i === 2 ? ["#ffd54f","#ffb300"] : ["#4fc3f7","#81d4fa"]
        }), i * 180);
      }
    }
  },
  {
    name: "粒子瀑布",
    icon: "🌊",
    desc: "从顶部倾泻而下后上浮",
    run() {
      confetti({ particleCount: 50, spread: 60, startVelocity: 10, gravity: -0.15, ticks: 350, origin: { x: 0.5, y: 0.3 }, shapes: ["circle"], scalar: 0.5, colors: ["#4fc3f7","#81d4fa","#b3e5fc","#e1f5fe","#fff"] });
    }
  },
  {
    name: "弹跳上升",
    icon: "🏀",
    desc: "粒子先冲上去再缓缓下来",
    run() {
      confetti({ particleCount: 30, spread: 35, startVelocity: 50, gravity: 1.5, ticks: 150, origin: { y: 0.95 }, shapes: ["circle","star"], colors: ["#ff8a65","#ff7043","#f4511e"] });
    }
  },
  {
    name: "萤火升腾",
    icon: "🪲",
    desc: "微小光点缓缓上浮，像萤火虫",
    run() {
      for (let i = 0; i < 8; i++) {
        setTimeout(() => confetti({
          particleCount: 3, spread: 20, startVelocity: 8,
          gravity: -0.25, ticks: 400,
          origin: { x: 0.3 + Math.random() * 0.4, y: 0.85 + Math.random() * 0.1 },
          shapes: ["circle"], scalar: 0.3,
          colors: ["#fff176","#fff9c4","#fffde7"]
        }), i * 120);
      }
    }
  },
  {
    name: "彩虹阶梯",
    icon: "🌈",
    desc: "七色粒子依次上升",
    run() {
      const rainbow = ["#ef5350","#ff9800","#ffeb3b","#66bb6a","#42a5f5","#7e57c2","#ec407a"];
      rainbow.forEach((color, i) => {
        setTimeout(() => confetti({
          particleCount: 6, spread: 20, startVelocity: 20,
          gravity: -0.6, ticks: 200,
          origin: { x: 0.25 + i * 0.08, y: 0.85 },
          shapes: ["circle"], scalar: 0.5, colors: [color]
        }), i * 100);
      });
    }
  },
  {
    name: "达成光环",
    icon: "🏆",
    desc: "先光环扩散，再星星升起",
    run() {
      confetti({ particleCount: 20, spread: 360, startVelocity: 5, gravity: 0, ticks: 150, origin: { x: 0.5, y: 0.65 }, shapes: ["circle"], scalar: 1.5, colors: ["#ffd54f80","#ffab0080"] });
      setTimeout(() => confetti({ particleCount: 25, spread: 30, startVelocity: 25, gravity: -0.6, ticks: 250, origin: { y: 0.8 }, shapes: ["star"], scalar: 0.6, colors: ["#ffd54f","#ffab00","#ffe082"] }), 200);
    }
  },
  {
    name: "层层递进",
    icon: "📊",
    desc: "每层越来越高，像进度条",
    run() {
      for (let i = 0; i < 5; i++) {
        setTimeout(() => confetti({
          particleCount: 4 + i * 2, spread: 15,
          startVelocity: 15, gravity: -0.5 - i * 0.1, ticks: 200 + i * 30,
          origin: { x: 0.3 + i * 0.1, y: 0.9 - i * 0.04 },
          shapes: ["circle"], scalar: 0.4 + i * 0.05,
          colors: [i < 3 ? "#a5d6a7" : i < 4 ? "#66bb6a" : "#ffd54f"]
        }), i * 200);
      }
    }
  },
  {
    name: "静谧之光",
    icon: "🕯️",
    desc: "极少粒子，极慢上升，高级感",
    run() {
      confetti({ particleCount: 8, spread: 15, startVelocity: 8, gravity: -0.2, ticks: 400, origin: { x: 0.5, y: 0.85 }, shapes: ["circle"], scalar: 0.4, colors: ["#fff","#f5f5f5","#e0e0e0"] });
    }
  },
  {
    name: "全屏爆发上升",
    icon: "🚀",
    desc: "最强烈的上升感，全屏粒子",
    run() {
      const base = { startVelocity: 35, gravity: -0.7, ticks: 250, shapes: ["circle","star"], scalar: 0.6 };
      confetti({ ...base, particleCount: 25, spread: 40, origin: { x: 0.3, y: 0.9 }, colors: ["#4fc3f7","#81d4fa"] });
      confetti({ ...base, particleCount: 25, spread: 40, origin: { x: 0.5, y: 0.85 }, colors: ["#ffd54f","#ffab00"] });
      confetti({ ...base, particleCount: 25, spread: 40, origin: { x: 0.7, y: 0.9 }, colors: ["#66bb6a","#a5d6a7"] });
      setTimeout(() => confetti({ ...base, particleCount: 30, spread: 60, origin: { x: 0.5, y: 0.8 }, colors: ["#fff","#e3f2fd","#bbdefb"] }), 300);
    }
  }
];

// Render cards
const grid = document.getElementById("grid");
effects.forEach((ef, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<span class="num">${i + 1}</span><div class="icon">${ef.icon}</div><div class="name">${ef.name}</div><div class="desc">${ef.desc}</div>`;
  card.onclick = () => {
    ef.run();
    selectedIdx = i;
    document.getElementById("pickBar").style.display = "block";
    document.querySelectorAll(".card").forEach(c => c.style.borderColor = "transparent");
    card.style.borderColor = "#4fc3f7";
  };
  grid.appendChild(card);
});

// Simulate checkbox
let simState = 0; // 0=empty, 1=progress, 2=done
const simBox = document.getElementById("simBox");
const simStates = ["⬜", "⏳", "✅"];

function toggleSim() {
  simState = (simState + 1) % 3;
  simBox.textContent = simStates[simState];
  if (simState === 2 && selectedIdx !== null) {
    effects[selectedIdx].run();
  }
}

function showCode() {
  const el = document.getElementById("codeOutput");
  const ef = effects[selectedIdx];
  el.style.display = el.style.display === "none" ? "block" : "none";
  // Generate code from the effect's run function
  const code = `// ${ef.name}\n// 替换 NoteEditor.jsx 中 toggleCb 里的 confetti 调用\nif (next === "✅ ") {\n  ${ef.run.toString().replace(/^function\s*\(\)\s*\{/, "").replace(/\}$/, "").trim()}\n}`;
  el.textContent = code;
}
</script>
</body>
</html>
