<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>动画测试 - 完成 & 进行中</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: system-ui; padding: 20px 20px 60px; }
h1 { text-align: center; margin-bottom: 6px; font-size: 22px; }
.subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 13px; }
.section { max-width: 920px; margin: 0 auto 32px; }
.section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; padding-left: 4px; display: flex; align-items: center; gap: 8px; }
.section-title .tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
.tag-done { background: #2e7d32; color: #c8e6c9; }
.tag-progress { background: #e65100; color: #ffe0b2; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.card {
  background: #16213e; border-radius: 10px; padding: 14px 10px; text-align: center;
  cursor: pointer; transition: all 0.15s; border: 2px solid transparent; position: relative;
}
.card:hover { border-color: #4fc3f7; transform: translateY(-2px); }
.card:active { transform: scale(0.97); }
.card.selected { border-color: #4fc3f7; }
.num { font-size: 10px; color: #555; position: absolute; top: 5px; left: 7px; }
.icon { font-size: 24px; margin-bottom: 4px; }
.name { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
.desc { font-size: 10px; color: #777; line-height: 1.2; }
.check-area {
  max-width: 920px; margin: 0 auto; text-align: center;
  background: #16213e; border-radius: 10px; padding: 20px;
}
.check-area h3 { margin-bottom: 14px; font-size: 15px; }
.sim { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; cursor: pointer; user-select: none; }
.sim .box { width: 24px; height: 24px; border: 2px solid #555; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.status { margin-top: 10px; font-size: 12px; color: #888; }
</style>
</head>
<body>

<h1>动画效果测试</h1>
<p class="subtitle">分别选择「进行中」和「完成」的效果，底部可模拟完整流程</p>

<div class="section">
  <div class="section-title">⏳ 进行中 <span class="tag tag-progress">20 种</span></div>
  <div class="grid" id="progressGrid"></div>
</div>

<div class="section">
  <div class="section-title">✅ 完成 <span class="tag tag-done">20 种</span></div>
  <div class="grid" id="doneGrid"></div>
</div>

<div class="check-area">
  <h3>模拟 checkbox 完整流程</h3>
  <div class="sim" onclick="toggleSim()">
    <div class="box" id="simBox">⬜</div>
    <span>点击循环：⬜ → ⏳ → ✅ → ⬜</span>
  </div>
  <div class="status" id="statusText">请先从上方选择进行中和完成的效果</div>
</div>

<script>
let selectedProgress = null;
let selectedDone = null;

    name: "单点脉冲",

// ── 渲染 ──
function renderGrid(containerId, effects, type) {
  const grid = document.getElementById(containerId);
  effects.forEach((ef, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<span class="num">${i + 1}</span><div class="icon">${ef.icon}</div><div class="name">${ef.name}</div><div class="desc">${ef.desc}</div>`;
    card.onclick = () => {
      ef.run();
      if (type === "progress") {
        selectedProgress = i;
        document.querySelectorAll(`#${containerId} .card`).forEach(c => c.classList.remove("selected"));
      } else {
        selectedDone = i;
        document.querySelectorAll(`#${containerId} .card`).forEach(c => c.classList.remove("selected"));
      }
      card.classList.add("selected");
      updateStatus();
    };
    grid.appendChild(card);
  });
}

renderGrid("progressGrid", progressEffects, "progress");
renderGrid("doneGrid", doneEffects, "done");

function updateStatus() {
  const el = document.getElementById("statusText");
  const parts = [];
  if (selectedProgress !== null) parts.push(`⏳ ${progressEffects[selectedProgress].name}`);
  if (selectedDone !== null) parts.push(`✅ ${doneEffects[selectedDone].name}`);
  el.textContent = parts.length ? `已选：${parts.join(" + ")}` : "请先从上方选择进行中和完成的效果";
}

// ── 模拟 checkbox ──
let simState = 0;
const simBox = document.getElementById("simBox");
const simStates = ["⬜", "⏳", "✅"];

function toggleSim() {
  simState = (simState + 1) % 3;
  simBox.textContent = simStates[simState];
  if (simState === 1 && selectedProgress !== null) {
    progressEffects[selectedProgress].run();
  }
  if (simState === 2 && selectedDone !== null) {
    doneEffects[selectedDone].run();
  }
}
</script>
</body>
</html>
