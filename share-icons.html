<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>分享按钮图标选择</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: system-ui; padding: 20px; }
h1 { text-align: center; margin-bottom: 20px; font-size: 20px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; max-width: 600px; margin: 0 auto; }
.card {
  background: #16213e; border-radius: 10px; padding: 16px; text-align: center;
  cursor: pointer; transition: all 0.15s; border: 2px solid transparent;
}
.card:hover { border-color: #4fc3f7; transform: translateY(-2px); }
.card.selected { border-color: #4fc3f7; background: #1a2744; }
.num { font-size: 10px; color: #555; margin-bottom: 8px; }
.icon-wrap {
  width: 36px; height: 36px; margin: 0 auto 8px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.08); border-radius: 6px;
}
.icon-wrap svg { width: 20px; height: 20px; }
.name { font-size: 11px; color: #aaa; }
.preview { max-width: 600px; margin: 24px auto 0; text-align: center; background: #16213e; border-radius: 10px; padding: 20px; }
.preview h3 { margin-bottom: 12px; font-size: 14px; color: #888; }
.titlebar {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(0,0,0,0.04); border-radius: 4px; padding: 4px 8px;
}
.titlebar .title { font-size: 14px; color: #333; background: #fff; padding: 2px 12px; border-radius: 3px; }
.titlebar .btn {
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  border-radius: 3px; cursor: pointer; transition: background 0.1s;
}
.titlebar .btn:hover { background: rgba(0,0,0,0.1); }
.titlebar .btn svg { width: 16px; height: 16px; }
.code { max-width: 600px; margin: 12px auto 0; background: #0d1117; color: #7ee787; padding: 12px; border-radius: 6px; font-size: 12px; display: none; text-align: left; white-space: pre-wrap; font-family: monospace; }
</style>
</head>
<body>
<h1>分享按钮图标</h1>
<div class="grid" id="grid"></div>

<div class="preview">
  <h3>预览效果（模拟标题栏）</h3>
  <div class="titlebar">
    <span class="title">便签标题</span>
    <div class="btn" id="previewBtn" style="background:rgba(0,0,0,0.05)">?</div>
    <div class="btn" style="font-size:18px;font-weight:700;color:#444">⋯</div>
    <div class="btn" style="font-size:18px;font-weight:700;color:#666">×</div>
  </div>
</div>

<pre class="code" id="codeBlock"></pre>

<script>
const icons = [
  {
    name: "经典分享",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>`
  },
  {
    name: "纸飞机",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>`
  },
  {
    name: "向外箭头",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`
  },
  {
    name: "链接",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>`
  },
  {
    name: "信号塔",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h.01"/><path d="M7 20v-4"/><path d="M12 20v-8"/><path d="M17 20V8"/><path d="M22 4v16"/></svg>`
  },
  {
    name: "上传云",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>`
  },
  {
    name: "转发箭头",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 17 20 12 15 7"/><path d="M4 18v-2a4 4 0 014-4h12"/></svg>`
  },
  {
    name: "喇叭",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-5v12L3 13v-2z"/><path d="M11.6 16.8a3 3 0 11-5.8-1.6"/></svg>`
  },
  {
    name: "地球",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>`
  },
  {
    name: "火箭",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 00-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 012-3.95A12.88 12.88 0 0122 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 01-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>`
  },
  {
    name: "外部链接",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`
  },
  {
    name: "三连点",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`
  },
  {
    name: "翅膀",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>`
  },
  {
    name: "指南针",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>`
  },
  {
    name: "闪电",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`
  },
  {
    name: "礼物",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>`
  },
  {
    name: "对话气泡",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>`
  },
  {
    name: "标签",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`
  },
  {
    name: "箭头右上",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>`
  },
  {
    name: "发送",
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`
  }
];

const grid = document.getElementById("grid");
const previewBtn = document.getElementById("previewBtn");
const codeBlock = document.getElementById("codeBlock");
let selectedIdx = null;

icons.forEach((icon, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="num">${i + 1}</div><div class="icon-wrap">${icon.svg}</div><div class="name">${icon.name}</div>`;
  card.onclick = () => {
    selectedIdx = i;
    document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
    previewBtn.innerHTML = icon.svg;
    codeBlock.style.display = "block";
    codeBlock.textContent = `// ${icon.name}\n${icon.svg.replace(/></g, '>\n<')}`;
  };
  grid.appendChild(card);
});
</script>
</body>
</html>
